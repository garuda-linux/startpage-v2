<!doctype html>
<html class="p-dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="Garuda's Startpage" property="og:title" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="#1e1e2e" name="theme-color" />
    <meta content="dark light" name="color-scheme" />

    <title>Garuda's Startpage</title>
    <base href="/" />

    <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180" />
    <link href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png" />
    <link href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png" />
    <link href="/site.webmanifest" rel="manifest" />

    <script>
      // Before Angular boots: apply the saved colour scheme and start fetching the wallpaper,
      // so neither waits for the app bundle. Mirrors optimizedWallpaper() in functions.ts.
      try {
        var s = JSON.parse(localStorage.getItem('settings') || '{}');
        if (s.darkMode === false) document.documentElement.classList.remove('p-dark');
        var w = s.wallpaper === 'custom' ? s.wallpaperUrl : s.wallpaper;
        if (w && w !== 'none') {
          var m = /^assets\/wallpapers\/([^/]+)\.(png|jpe?g)$/.exec(w);
          var needed = Math.max(screen.width, (screen.height * 16) / 9) * devicePixelRatio;
          var variant = s.blurBackground || needed <= 1280 ? '-1280' : needed <= 1920 ? '-1920' : '';
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.href = m ? 'assets/wallpapers/optimized/' + m[1] + variant + '.webp' : w;
          l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        }

        // Keep in sync with availableLanguages in src/environments/environment.*.ts
        var available = 'am ar de en es eu fr gl hi hu id it ja ko pl pt ru sl sv sw tr ua uz zh-CN'.split(' ');
        var cached = JSON.parse(localStorage.getItem('translations') || '{}');
        var cachedAt = Number(localStorage.getItem('translations/timestamp'));
        var fresh = cachedAt && Date.now() - cachedAt < 864e5;
        // ConfigService activates the browser language first and the saved one after settings load
        [navigator.language.split('-')[0], s.languageChanged && s.language, 'en'].forEach(function (lang, i, all) {
          if (!lang || all.indexOf(lang) !== i || available.indexOf(lang) < 0 || (fresh && cached[lang])) return;
          var p = document.createElement('link');
          p.rel = 'preload';
          p.as = 'fetch';
          p.crossOrigin = 'anonymous';
          p.href = '/assets/i18n/' + lang + '.json';
          document.head.appendChild(p);
        });
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
