<ng-container *transloco="let t">
  <a (click)="skipToMain($event)" class="skip-link" href="#main">{{ t('common.skipToContent') }}</a>
  <app-wallpaper />
  <div class="relative z-10 overflow-x-clip">
    <div class="min-h-svh">
      <garuda-shell #shell [menuItems]="configService.settings().customMenuLinks">
        <a [attr.aria-label]="t('menu.home')" class="shell-logo" garudaShellBarStart routerLink="/">
          @if (configService.logoSource(); as logo) {
            <img [src]="logo" alt="" fetchpriority="high" height="32" width="32" />
          }
        </a>
        <div garudaShellBarEnd>
          @if (configService.settings().avatarEnabled) {
            <button
              (click)="displayEasterEgg()"
              [attr.aria-label]="t('common.surprise')"
              class="shell-avatar"
              type="button"
            >
              <p-avatar
                [image]="
                  configService.settings().avatarUrl !== ''
                    ? configService.settings().avatarUrl
                    : '/assets/avatars/cat.png'
                "
                shape="circle"
              />
            </button>
          }
        </div>
        <div class="router-container">
          <router-outlet #routerOutlet="outlet"></router-outlet>
        </div>
      </garuda-shell>
    </div>
  </div>
</ng-container>
