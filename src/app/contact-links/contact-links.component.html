<div class="social-handles">
  @for (contact of contactsConfig(); track contact) {
    <div [class]="gridCols()">
      <garuda-card
        cardRole="product-showcase-small"
        class="cursor-pointer"
        (click)="$event.stopPropagation(); openLink(contact?.link)"
      >
        <div garudaCardTitleWrapper>
          <h4>{{ contact?.cardTitle }}</h4>
        </div>
        <div garudaCardThumbnailWrapper>
          <img [src]="contact?.cardImageUrl" width="60" height="60" alt="logo" />
        </div>
      </garuda-card>
    </div>
  }
</div>
