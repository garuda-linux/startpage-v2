<ng-container *transloco="let t">
  <div class="community">
    <span class="community__label" id="community-label">{{ t('home.joinCommunity') }}</span>
    <ul aria-labelledby="community-label" class="community__list">
      @for (contact of contacts; track contact.link) {
        <li>
          <a
            [attr.aria-label]="contact.title"
            [href]="contact.link"
            [target]="configService.settings().openInNewTab ? '_blank' : '_self'"
            [title]="contact.title + ' · ' + contact.subtitle"
            class="pill"
            rel="noopener"
          >
            <img [src]="contact.logo" alt="" height="18" loading="lazy" width="18" />
          </a>
        </li>
      }
    </ul>
  </div>
</ng-container>
