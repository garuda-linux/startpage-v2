<ng-container *transloco="let t">
  <p class="joke">
    @for (text of [joke()]; track text) {
      <span class="joke__text" animate.enter="joke__text--in">{{ text }}</span>
    }
    <button
      (click)="setJoke()"
      [attr.aria-label]="t('home.anotherJoke')"
      [title]="t('home.anotherJoke')"
      class="joke__again"
      type="button"
    >
      <i class="pi pi-refresh" [class.joke__spin]="spin()" aria-hidden="true"></i>
    </button>
  </p>
</ng-container>
